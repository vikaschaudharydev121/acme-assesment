services:
  app:
    build: .
    image: acme/salary-management:latest
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
    volumes:
      - salary-data:/data
    # Hardening: immutable root filesystem, no privilege escalation, no Linux capabilities.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  salary-data:
